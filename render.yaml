services:
  - type: web
    name: financial-organizer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false  # Você irá adicionar manualmente
      - key: DATABASE_NAME
        value: financial_organizer
    healthCheckPath: /health
